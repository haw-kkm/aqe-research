# DEV ONLY (worktree C:\vscode\aqe-dev): analysis/debate layer wiring run on a COPIED snapshot of real data.
# Never points at the production roots used by the running collector (E:/aqe-v2/...).
schema_version: "1.0.0"
mode: replay
paths:
  data_root: "E:/aqe-v2-dev/data"
  artifact_root: "E:/aqe-v2-dev/artifacts"
instruments:
  - {venue: binance, market_type: usdm_perpetual, instrument_id: BTCUSDT}
backfill:
  start: "2019-09-08T00:00:00Z"
context:
  backend: aqe_debate
  job_timeout_seconds: 300
  llm:
    provider: offline_scripted        # scripted model: wiring test only, never used for analysis
    model_id: aqe-offline-scripted-debate
  tradingagents:
    worker_python: ".venv-ta/Scripts/python.exe"
  debate:
    max_llm_calls: 8
risk_ruleset: configs/risk_rules_v1.yaml
analysis:
  experiment_config: configs/experiment.yaml
  decision_delay_seconds: 10
