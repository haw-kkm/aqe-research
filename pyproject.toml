[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aqe"
version = "0.1.0"
description = "AQE research system: LightGBM + small causal TCN + TradingAgents context + time-ordered meta model + independent risk code (research/replay/shadow only)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16",
  "lightgbm>=4.3",
  "scikit-learn>=1.5",
  "torch>=2.3",
  "httpx>=0.27",
  "websockets>=12",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8"]

[project.scripts]
aqe = "aqe.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aqe = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "network: requires public internet (Binance/GitHub); skipped unless AQE_NETWORK_TESTS=1",
  "slow: long-running",
]
